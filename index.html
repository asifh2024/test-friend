
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>How Well Do You Know Me? ❤️</title>

    <meta
        name="description"
        content="Take this friendship quiz and discover how well you know me!"
    >

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="container">

        <!-- Welcome Screen -->
        <section id="welcomeScreen" class="card">
            <div class="emoji">❤️</div>

            <h1>How Well Do You Know Me?</h1>

            <p class="subtitle">
                Let's find out how well you really know me!
            </p>

            <div class="heart-divider">🤔❤️</div>

            <label for="friendName">First, tell me your name</label>

            <input
                type="text"
                id="friendName"
                placeholder="Enter your name..."
                maxlength="60"
                autocomplete="given-name"
            >

            <button id="startButton" class="primary-button">
                Let's Start 💖
            </button>

            <p id="welcomeError" class="error-message" role="alert"></p>
        </section>


        <!-- Quiz Screen -->
        <section id="quizScreen" class="card hidden">
            <div class="quiz-top">
                <span id="questionCounter">Question 1 of 10</span>
                <span id="progressPercentage">10%</span>
            </div>

            <div class="progress-track">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <h2 id="questionText"></h2>

            <div
                id="optionsContainer"
                class="options-container"
            ></div>

            <p
                id="selectionMessage"
                class="selection-message"
                role="status"
            ></p>

            <div class="navigation-buttons">
                <button
                    id="previousButton"
                    class="secondary-button"
                    type="button"
                >
                    ← Previous
                </button>

                <button
                    id="nextButton"
                    class="primary-button"
                    type="button"
                >
                    Next →
                </button>

                <button
                    id="submitButton"
                    class="primary-button hidden"
                    type="button"
                >
                    Submit Quiz 💌
                </button>
            </div>
        </section>


        <!-- Result Screen -->
        <section id="resultScreen" class="card hidden">
            <div id="resultEmoji" class="result-emoji">🎉</div>

            <h1 id="resultHeading">Your Friendship Result!</h1>

            <p id="resultGreeting" class="subtitle"></p>

            <div class="score-circle">
                <span id="scoreValue">0/10</span>
                <small>Friendship Score</small>
            </div>

            <h2 id="resultMessage" class="result-message"></h2>

            <p
                id="resultDescription"
                class="result-description"
            ></p>

            <div class="solutions-section">
                <h2>📝 Let's Check Your Answers</h2>

                <p id="wrongQuestionSummary"></p>

                <div id="solutionsContainer"></div>
            </div>

            <div class="saved-message">
                💗
            </div>

            <p
                id="submissionStatus"
                class="submission-status"
                role="status"
                aria-live="polite"
            ></p>
        </section>

    </main>

    <footer>
        Made with ❤️.
    </footer>
</body>
</html>
